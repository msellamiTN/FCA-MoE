[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "fca-moe-t4"
version = "0.1.0"
description = "FCA-guided MoE locality research prototype"
requires-python = ">=3.10"
dependencies = ["torch>=2.5", "numpy>=1.26"]
[tool.setuptools.packages.find]
include = ["fca_moe*"]
