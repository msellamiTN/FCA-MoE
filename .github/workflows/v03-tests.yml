name: FCA-MoE v0.3 tests

on:
  push:
    branches: ["research/fca-moe-v0.3"]
    paths:
      - "research/v03/**"
      - ".github/workflows/v03-tests.yml"
  pull_request:
    paths:
      - "research/v03/**"
      - ".github/workflows/v03-tests.yml"

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: research/v03/requirements.txt
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./research/v03
          python -m pip install pytest
      - name: Run unit tests
        working-directory: research/v03
        run: python -m pytest -q
      - name: Run smoke pipeline
        working-directory: research/v03
        run: python scripts/run_v03_smoke.py --tokens 1024 --output /tmp/v03-smoke
