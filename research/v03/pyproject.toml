[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fca-moe-v03"
version = "0.3.0"
description = "FCA and pairwise-MaxEnt research scaffold for MoE expert activation analysis"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11"]

[tool.setuptools.packages.find]
where = ["."]
include = ["moe_fca*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
